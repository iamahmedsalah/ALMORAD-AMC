name: almorad-amc-test
services:
  postgres-test:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amc_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}
      POSTGRES_DB: amc_test
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d amc_test']
      interval: 3s
      timeout: 3s
      retries: 10
