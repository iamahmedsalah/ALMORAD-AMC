name: Native isolated PostgreSQL 18
description: Start an isolated native PostgreSQL cluster for CI tests and release rehearsal
inputs:
  database:
    description: Isolated amc_test or amc_*_test database
    required: true
  user:
    description: Ephemeral local database owner
    required: true
  password:
    description: Ephemeral local password, never a production credential
    required: true
runs:
  using: composite
  steps:
    - name: Install PostgreSQL 18 from the official PostgreSQL apt repository
      shell: bash
      run: |
        set -euo pipefail
        # GitHub's Ubuntu mirror list can stall or fail DNS on azure.archive.ubuntu.com.
        # This runner is disposable; use Ubuntu's signed primary archive directly.
        ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        if test -f "$ubuntu_sources" && grep -qF 'mirror+file:/etc/apt/apt-mirrors.txt' "$ubuntu_sources"; then
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' "$ubuntu_sources"
        fi
        printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/zz-amc-ci-acquire.conf >/dev/null
        sudo apt-get update --error-on=any
        sudo apt-get install --yes postgresql-common ca-certificates
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get update --error-on=any
        sudo apt-get install --yes postgresql-18 postgresql-client-18
        test "$(/usr/lib/postgresql/18/bin/pg_config --version | cut -d' ' -f2 | cut -d. -f1)" = '18'
        echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
    - name: Start a private loopback-only test cluster
      shell: bash
      env:
        PGUSER: ${{ inputs.user }}
        PGPASSWORD: ${{ inputs.password }}
        PGDATABASE: ${{ inputs.database }}
        PGHOST: 127.0.0.1
        PGPORT: '55432'
        PGSSLMODE: disable
        PGOPTIONS: ''
      run: bash "$GITHUB_ACTION_PATH/start.sh"
