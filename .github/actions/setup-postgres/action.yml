name: Native isolated PostgreSQL 18
description: Start a runner-owned test cluster without containers
inputs:
  database:
    description: Isolated amc_*_test database
    required: true
  user:
    description: Ephemeral local database owner
    required: true
  password:
    description: Ephemeral local password, never a production credential
    required: true
runs:
  using: composite
  steps:
    - name: Install PostgreSQL 18 from the official PostgreSQL apt repository
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes postgresql-common ca-certificates
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install --yes postgresql-18 postgresql-client-18
        echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
    - name: Start a private loopback-only test cluster
      shell: bash
      env:
        PGUSER: ${{ inputs.user }}
        PGPASSWORD: ${{ inputs.password }}
        PGDATABASE: ${{ inputs.database }}
        PGHOST: 127.0.0.1
        PGPORT: '55432'
        PGSSLMODE: disable
        PGOPTIONS: ''
        PGSERVICE: ''
      run: |
        set -euo pipefail
        [[ "$PGUSER" =~ ^amc_[a-z0-9_]+$ ]] || exit 1
        [[ "$PGDATABASE" =~ ^amc_[a-z0-9_]+_test$ ]] || exit 1
        umask 077
        task_pg_dir="$RUNNER_TEMP/amc-ci-postgres"
        mkdir "$task_pg_dir"
        printf '%s\n' "$PGPASSWORD" > "$task_pg_dir/password"
        trap 'rm -f "$task_pg_dir/password"' EXIT
        initdb --pgdata="$task_pg_dir/data" --username="$PGUSER" \
          --auth-local=trust --auth-host=scram-sha-256 --pwfile="$task_pg_dir/password" \
          > "$task_pg_dir/init.log" 2>&1
        pg_ctl --pgdata="$task_pg_dir/data" --log="$task_pg_dir/server.log" \
          --options="-h 127.0.0.1 -p 55432 -c unix_socket_directories=''" --wait start
        createdb --maintenance-db=postgres --no-password --owner="$PGUSER" "$PGDATABASE"
