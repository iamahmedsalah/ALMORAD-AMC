name: CI/CD - Vercel monorepo
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging, 'release/**']
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Validate only or release this main-branch commit to Vercel
        type: choice
        default: validate
        options: [validate, vercel]
permissions:
  contents: read
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  security:
    uses: ./.github/workflows/security.yml
  release:
    name: Deploy, verify and promote Vercel
    needs: [validate, security]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'vercel'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production-vercel
      url: https://almorad-amc.vercel.app
    concurrency:
      group: production-vercel
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_9mwMW7QGs5HfZuTYgXeftexz
      VERCEL_PROJECT_ID: prj_3OWasVxcZyRAJDWlt9pNqCW6EW3S
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify deployment access is configured
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set production-vercel secret VERCEL_TOKEN}"
      - run: pnpm install --frozen-lockfile
      - name: Install pinned deployment CLI
        run: npm install --global vercel@65.11.0
      - name: Prepare protected candidate verification
        run: node scripts/ci/protection-bypass.mjs prepare
      - name: Deploy production candidate without assigning production domain
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --build-env "AMC_RELEASE_MIGRATIONS=0" \
            > "$RUNNER_TEMP/amc-vercel-deployment.txt"
          node scripts/ci/deployment-url.mjs "$RUNNER_TEMP/amc-vercel-deployment.txt" >> "$GITHUB_ENV"
      - name: Verify candidate health, schema and bilingual routes
        run: node scripts/ci/release-smoke.mjs
      - name: Promote verified deployment
        shell: bash
        run: vercel promote "$RELEASE_URL" --yes --token "$VERCEL_TOKEN"
      - name: Verify production domain after promotion
        run: node scripts/ci/release-smoke.mjs
        env:
          RELEASE_URL: https://almorad-amc.vercel.app
      - name: Summarize release
        shell: bash
        run: |
          printf 'Released commit %s to %s. Database backup, restore rehearsal and migrations were not run by this workflow.\n' \
            "$GITHUB_SHA" "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke temporary candidate verification access
        if: always()
        run: node scripts/ci/protection-bypass.mjs cleanup
