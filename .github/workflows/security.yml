name: Security gates
on:
  workflow_call:
    inputs:
      scan_containers:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      scan_containers:
        description: Also validate future VPS container images
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan source without printing secret values
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact --exit-code 1
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
  containers:
    # Docker is local-preview infrastructure; the production target is Vercel.
    if: inputs.scan_containers == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [web, api]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.${{ matrix.service }} -t amc-${{ matrix.service }}:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: amc-${{ matrix.service }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: amc-${{ matrix.service }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.service }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json
