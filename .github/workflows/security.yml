name: Security gates
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci-tool
        with:
          tool: gitleaks
      - name: Scan source without printing secret values
        run: gitleaks dir . --config .gitleaks.toml --redact --exit-code 1
