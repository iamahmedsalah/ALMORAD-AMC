name: Validate workspace
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://amc_ci:ci_ephemeral_only@127.0.0.1:5432/amc_test
      TEST_DATABASE_URL: postgresql://amc_ci:ci_ephemeral_only@127.0.0.1:5432/amc_test
      DIRECT_URL: postgresql://amc_ci:ci_ephemeral_only@127.0.0.1:5432/amc_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amc_ci
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: amc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amc_ci -d amc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow syntax and shell steps
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.7
      - uses: pnpm/action-setup@v5
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Review migration policy
        run: pnpm ci:release:test && node scripts/ci/migrations.mjs policy
      - run: pnpm icons:generate && git diff --exit-code -- apps/web/src/components/ui/solar-data.ts
      - run: pnpm db:generate && pnpm db:validate
      - run: pnpm lint && pnpm test
      # This service is disposable; this step never receives production credentials.
      - run: pnpm db:migrate && pnpm test:db
      - run: pnpm db:restore:check
        env:
          LOCAL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm build
      - run: pnpm typecheck
      - name: Package the public browser build once for all shards
        run: tar --exclude='.next/cache' --exclude='.next/dev' --exclude='.next/standalone' -czf "$RUNNER_TEMP/web-e2e-build.tar.gz" -C apps/web .next
      - uses: actions/upload-artifact@v6
        with:
          name: web-e2e-build
          path: ${{ runner.temp }}/web-e2e-build.tar.gz
          compression-level: 0
          retention-days: 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:staff
      - run: pnpm audit --prod --audit-level=high
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: staff-browser-results
          path: |
            playwright-report/
            playwright-staff-report/
            test-results/
          retention-days: 7
  public-e2e:
    name: Public E2E (${{ matrix.shard }}/4)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: web-e2e-build
          path: ${{ runner.temp }}/web-e2e-build
      - name: Restore the verified web build
        run: tar -xzf "$RUNNER_TEMP/web-e2e-build/web-e2e-build.tar.gz" -C apps/web
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the complete public suite across four shards
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: public-browser-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
