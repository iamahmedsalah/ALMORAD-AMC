name: Validate workspace
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://amc_ci:ci_ephemeral_only@127.0.0.1:55432/amc_test
      TEST_DATABASE_URL: postgresql://amc_ci:ci_ephemeral_only@127.0.0.1:55432/amc_test
      DIRECT_URL: postgresql://amc_ci:ci_ephemeral_only@127.0.0.1:55432/amc_test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-tool
        with:
          tool: actionlint
      - name: Validate workflow syntax and shell steps
        run: actionlint
      - uses: pnpm/action-setup@v5
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-postgres
        with:
          database: amc_test
          user: amc_ci
          password: ci_ephemeral_only
      - name: Review migration policy
        run: pnpm ci:release:test && node scripts/ci/migrations.mjs policy
      - run: pnpm icons:generate && git diff --exit-code -- apps/web/src/components/ui/solar-data.ts
      - run: pnpm db:generate && pnpm db:validate
      - run: pnpm lint && pnpm test
      # This native cluster is disposable and never receives production credentials.
      - run: pnpm db:migrate && pnpm test:db
      - run: pnpm db:restore:check
      - run: pnpm build
      - run: pnpm typecheck
      - name: Package the public browser build once for all shards
        run: tar --exclude='.next/cache' --exclude='.next/dev' --exclude='.next/standalone' -czf "$RUNNER_TEMP/web-e2e-build.tar.gz" -C apps/web .next
      - uses: actions/upload-artifact@v6
        with:
          name: web-e2e-build
          path: ${{ runner.temp }}/web-e2e-build.tar.gz
          compression-level: 0
          retention-days: 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:staff
      - run: pnpm audit --prod --audit-level=high
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: staff-browser-results
          path: |
            playwright-report/
            playwright-staff-report/
            test-results/
          retention-days: 7
      - name: Stop the isolated validation cluster
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/amc-ci-postgres/data/postmaster.pid"; then
            pg_ctl --pgdata="$RUNNER_TEMP/amc-ci-postgres/data" --mode=fast --wait stop
          fi
  public-e2e:
    name: Public E2E (${{ matrix.shard }}/4)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: web-e2e-build
          path: ${{ runner.temp }}/web-e2e-build
      - name: Restore the verified web build
        run: tar -xzf "$RUNNER_TEMP/web-e2e-build/web-e2e-build.tar.gz" -C apps/web
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the complete public suite across four shards
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: public-browser-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
