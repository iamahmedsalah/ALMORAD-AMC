packages:
  - apps/*
  - packages/*
storeDir: .pnpm-store
saveExact: true
networkConcurrency: 4
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
# Targeted transitive fixes; Prisma config/generate/DB checks validate compatibility.
overrides:
  '@prisma/config>deepmerge-ts': 8.0.0
  'prisma>mysql2': 3.23.1
minimumReleaseAgeExclude:
  - '@vercel/cli-config@0.3.7'
  - '@vercel/functions@3.11.0'
  - '@vercel/oidc@4.0.7'
