packages:
  - apps/*
  - packages/*
storeDir: .pnpm-store
saveExact: true
networkConcurrency: 4
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
# Targeted transitive fixes; Prisma config/generate/DB checks validate compatibility.
overrides:
  '@prisma/config>deepmerge-ts': 8.0.0
  'prisma>mysql2': 3.23.1
# picomatch >=4.0.8 (GHSA-fc5q-39xc-vjpf) is not yet published on npm (latest is 4.0.7);
# only pulled via next-intl -> @parcel/watcher (file-watching, no untrusted glob input).
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
minimumReleaseAgeExclude:
  - '@vercel/cli-config@0.3.7'
  - '@vercel/functions@3.11.0'
  - '@vercel/oidc@4.0.7'
